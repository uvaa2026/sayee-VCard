  .waves { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }

  .content { position: relative; z-index: 1; }

  h1 {

  .rule { width: 56px; height: 3px; background: var(--orange); border-radius: 2px; margin: 14px auto; }
  .role { text-align: center; font-weight: 600; font-size: 16px; }
  .tags { text-align: center; color: var(--muted); font-size: 14px; margin-top: 4px; }
  .tagline {
    text-align: center; font-style: italic; color: var(--orange-2);
    font-size: 14px; margin-top: 12px;

  .save {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 26px 0 22px; padding: 16px; border-radius: 14px;

    color: #fff; text-decoration: none; font-weight: 600; font-size: 16px;
    box-shadow: 0 10px 24px rgba(217,102,43,.35);
  }
  .save:active { transform: scale(.98); }

  .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 22px; }
  .quick a {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    color: var(--text); text-decoration: none; font-size: 12px; font-weight: 500;
  }
  .quick .ic {
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--orange); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }

  .list {
    background: rgba(255,255,255,.05); border: 1px solid var(--line);
    border-radius: 16px; overflow: hidden; list-style: none;
  }
  .list a {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line);
  }
  .list li:last-child a { border-bottom: 0; }
  .list .ic {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    background: rgba(217,102,43,.15); color: var(--orange-2);
    display: flex; align-items: center; justify-content: center;
  }
  .list small { display: block; color: var(--muted); font-size: 12px; }
  .list div { font-size: 15px; word-break: break-word; }

  .foot { text-align: center; margin-top: 22px; }
  .share {

    padding: 10px 20px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;

  svg.i { width: 22px; height: 22px; }
  .list svg.i { width: 18px; height: 18px; }
</style>
